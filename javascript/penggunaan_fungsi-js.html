<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Fungsi</title>
</head>
<body>
    <script type="text/javascript">
         
        //fungsi salam
        function salam() {
            document.write('<h2>Assalamualaikum</h2>');
        }
 
        //memanggil fungsi
        salam();
 
        //fungsi dengan parameter
        function tambah(a, b) {
            let c = a+b;
            return c
        }
 
        let penjumlahan=tambah(8,10);
        document.write('hasil dari penjumlahan 8 dan 10 adalah '+penjumlahan);
    </script>
    
</body>
</html>
