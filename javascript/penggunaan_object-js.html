<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Object</title>
</head>
<body>
    <script type="text/javascript">
        // membuat Object
 
        let well = {
            penulis : "Iqbal Khaqiqi",
            buku : [
                "Modul Pemrograman Dasar",
                "Modul Pemrograman Mobile"
            ],
            hal : 109,
            isTerbit : true
        }
 
        console.log(well);

        //membuat object dengan construtor
 
        function orang(nama,gender,umur,alamat) {
            this.nama = nama;
            this.gender = gender;
            this.umur = umur;
            this.alamat = alamat;
        }
 
        //membuat instance object
        let Dewasa = new orang("Iqbal", "L", 19,['jalan raya', 'tanjung', 'kab nganjuk']);
        console.log(Dewasa);
    </script>
</body>
</html>
